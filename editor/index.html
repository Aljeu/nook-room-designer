<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nook — Room planner</title>
  <style>
    .entry-status { min-height: 60vh; display: grid; place-content: center; padding: 24px; text-align: center; font-family: system-ui, sans-serif; color: #24302b; background: #fafaf7; }
    .entry-status button { justify-self: center; border: 0; border-radius: 6px; padding: 10px 18px; background: #35614c; color: white; font: inherit; cursor: pointer; }
    .entry-status button:focus-visible { outline: 3px solid #255a91; outline-offset: 3px; }
  </style>
</head>
<body>
  <div id="root"><main class="entry-status"><p role="status">Opening your room planner…</p><noscript>Enable JavaScript to open the room planner.</noscript></main></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
